name: NoveoDesktop Linux

on:
  workflow_call:
    inputs:
      configuration:
        type: string
        default: Debug
      environment_only:
        type: boolean
        default: false
      build_missing_environment:
        type: boolean
        default: false
      self_hosted:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      configuration:
        description: Application build configuration
        type: choice
        options: [Debug, Release]
        default: Debug
      environment_only:
        description: Publish the build environment without building the app
        type: boolean
        default: false
      build_missing_environment:
        description: Build dependencies if neither the registry nor cache has them
        type: boolean
        default: true
      self_hosted:
        description: Use the dedicated noveo-build Linux runner
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: noveo-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:

  linux:
    name: Rocky Linux 8
    runs-on: ${{ inputs.self_hosted && fromJSON('["self-hosted", "Linux", "X64", "noveo-build"]') || 'ubuntu-latest' }}
    timeout-minutes: 360

    strategy:
      matrix:
        defines:
          - ""

    env:
      BUILD_CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
      UPLOAD_ARTIFACT: ${{ inputs.environment_only && 'false' || 'true' }}
      ONLY_CACHE: ${{ inputs.environment_only && 'true' || 'false' }}
      IMAGE_TAG: tdesktop:centos_env

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build environment identity.
        env:
          BUILD_ENV_HASH: ${{ hashFiles('Telegram/build/docker/centos_env/**') }}
        run: |
          echo "BUILD_ENV_KEY=$BUILD_ENV_HASH" >> "$GITHUB_ENV"
          if [ "$BUILD_CONFIGURATION" = Release ]; then
            echo "BUILD_CACHE_VARIANT=out-release-v1" >> "$GITHUB_ENV"
          else
            echo "BUILD_CACHE_VARIANT=out-v1" >> "$GITHUB_ENV"
          fi
          echo "REGISTRY_CACHE=ghcr.io/${GITHUB_REPOSITORY,,}-linux-cache" >> "$GITHUB_ENV"
          echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-linux-build:$BUILD_ENV_HASH" >> "$GITHUB_ENV"

      - name: Isolate registry credentials on self-hosted runners.
        if: inputs.self_hosted
        run: |
          mkdir -p "$RUNNER_TEMP/noveo-docker-config"
          chmod 700 "$RUNNER_TEMP/noveo-docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/noveo-docker-config" >> "$GITHUB_ENV"

      - name: Log in to build image registry.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull registered build image.
        id: registry-image
        run: |
          if docker pull "$REGISTRY_IMAGE"; then
            docker tag "$REGISTRY_IMAGE" "$IMAGE_TAG"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Registry image unavailable; trying the prepared image cache."
          fi

      - name: Restore prepared build image.
        if: steps.registry-image.outputs.available != 'true'
        id: cache-image
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/noveo-linux-image
          key: Linux-build-image-v1-${{ env.BUILD_ENV_KEY }}

      - name: Load prepared build image.
        if: steps.cache-image.outputs.cache-hit == 'true'
        run: zstd -dc "$RUNNER_TEMP/noveo-linux-image/image.tar.zst" | docker load

      - name: Check permission to rebuild missing environment.
        if: steps.registry-image.outputs.available != 'true' && steps.cache-image.outputs.cache-hit != 'true' && (!inputs.build_missing_environment || inputs.self_hosted)
        run: |
          echo "::error::The prepared build image is unavailable. Prepare it on a GitHub-hosted runner before using a self-hosted runner."
          exit 1

      - name: Compiler cache directory.
        run: |
          if [ '${{ inputs.self_hosted }}' = true ]; then
            echo "CCACHE_DIR=$HOME/.cache/noveo-tdesktop-ccache" >> "$GITHUB_ENV"
          else
            echo "CCACHE_DIR=$RUNNER_TEMP/.tdesktop-cache" >> "$GITHUB_ENV"
          fi

      - name: First set up.
        if: steps.registry-image.outputs.available != 'true' && steps.cache-image.outputs.cache-hit != 'true' && !inputs.self_hosted
        run: |
          sudo apt update
          curl -sSL https://install.python-poetry.org | python3 -
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Free up some disk space.
        if: steps.registry-image.outputs.available != 'true' && steps.cache-image.outputs.cache-hit != 'true' && !inputs.self_hosted
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          tool-cache: true

      - name: Set up Docker Buildx.
        if: steps.registry-image.outputs.available != 'true' && steps.cache-image.outputs.cache-hit != 'true'
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Libraries cache.
        if: steps.registry-image.outputs.available != 'true' && steps.cache-image.outputs.cache-hit != 'true'
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ runner.OS }}-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: ${{ runner.OS }}-libs-

      - name: Restore Docker cache mounts.
        if: steps.registry-image.outputs.available != 'true' && steps.cache-image.outputs.cache-hit != 'true'
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/.mount-cache
          dockerfile: Telegram/build/docker/centos_env/Dockerfile
          skip-extraction: ${{ steps.cache-libs.outputs.cache-hit }}

      - name: Libraries.
        if: steps.registry-image.outputs.available != 'true' && steps.cache-image.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache

      - name: Save prepared build image.
        if: steps.registry-image.outputs.available != 'true' && steps.cache-image.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/noveo-linux-image"
          docker save "$IMAGE_TAG" | zstd -T0 -1 -o "$RUNNER_TEMP/noveo-linux-image/image.tar.zst"

      - name: Cache prepared build image.
        if: steps.registry-image.outputs.available != 'true' && steps.cache-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/noveo-linux-image
          key: ${{ steps.cache-image.outputs.cache-primary-key }}

      - name: Publish prepared build image to registry.
        if: steps.registry-image.outputs.available != 'true'
        run: |
          docker tag "$IMAGE_TAG" "$REGISTRY_IMAGE"
          docker push "$REGISTRY_IMAGE"
          echo "Build environment published: $REGISTRY_IMAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Install registry client.
        if: env.ONLY_CACHE == 'false'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63
        with:
          version: 1.3.0

      - name: Registry snapshot login.
        if: env.ONLY_CACHE == 'false'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Restore registry incremental build.
        id: registry-build
        if: env.ONLY_CACHE == 'false'
        run: >-
          python3 .github/scripts/registry_cache.py pull
          --reference "$REGISTRY_CACHE:$BUILD_CACHE_VARIANT-$BUILD_ENV_KEY"
          --key "$BUILD_ENV_KEY" --root "$PWD" --paths out --compression zstd

      - name: Restore incremental build.
        if: env.ONLY_CACHE == 'false' && steps.registry-build.outputs.available != 'true'
        id: cache-build
        uses: actions/cache/restore@v6
        with:
          path: out
          key: Linux-${{ env.BUILD_CACHE_VARIANT }}-${{ env.BUILD_ENV_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: Linux-${{ env.BUILD_CACHE_VARIANT }}-${{ env.BUILD_ENV_KEY }}-

      - name: Restore unchanged input timestamps.
        if: env.ONLY_CACHE == 'false'
        run: python3 .github/scripts/build_cache.py restore

      - name: Restore Telegram Desktop cache.
        id: cache-tdesktop
        if: env.ONLY_CACHE == 'false' && !inputs.self_hosted
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.OS }}-tdesktop-${{ matrix.defines || 'null' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.OS }}-tdesktop-${{ matrix.defines || 'null' }}-

      - name: Telegram Desktop build.
        id: build
        if: env.ONLY_CACHE == 'false'
        run: |
          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo Define from matrix: $DEFINE
            echo "ARTIFACT_NAME=NoveoDesktop-Linux-x64-$BUILD_CONFIGURATION ${{ matrix.defines }}" >> $GITHUB_ENV
          else
            echo "ARTIFACT_NAME=NoveoDesktop-Linux-x64-$BUILD_CONFIGURATION" >> $GITHUB_ENV
          fi

          echo "ARTIFACT_PATH=$RUNNER_TEMP/noveo-linux-artifact" >> "$GITHUB_ENV"
          if [ "$BUILD_CONFIGURATION" = Release ]; then
            FLAGS=(-D 'CMAKE_C_FLAGS_RELEASE=-O2 -DNDEBUG -g0 -ffunction-sections -fdata-sections -fpch-preprocess'
                   -D 'CMAKE_CXX_FLAGS_RELEASE=-O2 -DNDEBUG -g0 -ffunction-sections -fdata-sections -fpch-preprocess'
                   -D 'CMAKE_EXE_LINKER_FLAGS_RELEASE=-Wl,--gc-sections')
          else
            FLAGS=(-D 'CMAKE_C_FLAGS_DEBUG=-O0 -fpch-preprocess'
                   -D 'CMAKE_CXX_FLAGS_DEBUG=-O0 -fpch-preprocess')
          fi

          mkdir -p "$CCACHE_DIR"
          docker run --rm -u "$(id -u)" -v "$CCACHE_DIR:/var/cache/ccache" \
            "$IMAGE_TAG" ccache -z

          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -v "${{ env.CCACHE_DIR }}:/var/cache/ccache" \
          -e CONFIG="$BUILD_CONFIGURATION" \
          -e KEEP_GOING=1 \
          -e CCACHE_SLOPPINESS=pch_defines,time_macros \
          $IMAGE_TAG \
          env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D CMAKE_CONFIGURATION_TYPES="$BUILD_CONFIGURATION" \
          "${FLAGS[@]}" \
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON \
          -D TDESKTOP_API_TEST=ON \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF \
          $DEFINE

      - name: Check.
        if: env.ONLY_CACHE == 'false'
        run: |
          filePath="out/$BUILD_CONFIGURATION/Telegram"
          if test -f "$filePath"; then
            echo "Build successfully done! :)"

            size=$(stat -c %s "$filePath")
            echo "File size of ${filePath}: ${size} Bytes."
          else
            echo "Build error, output file does not exist."
            exit 1
          fi

      - name: Stage Linux binaries.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          cd "out/$BUILD_CONFIGURATION"
          mkdir -p "$RUNNER_TEMP/noveo-linux-artifact"
          cp {Telegram,Updater} "$RUNNER_TEMP/noveo-linux-artifact/"

      - name: Strip packaged Linux binaries.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          docker run --rm -u "$(id -u)" \
            -v "$RUNNER_TEMP/noveo-linux-artifact:/artifact" "$IMAGE_TAG" \
            strip --strip-all \
            --remove-section=.comment \
            --remove-section=.GCC.command.line \
            --remove-section=.note.gnu.gold-version \
            /artifact/Telegram \
            /artifact/Updater
          ls -lh "$RUNNER_TEMP/noveo-linux-artifact/"{Telegram,Updater}

      - name: Smoke test the stripped Linux release.
        if: env.UPLOAD_ARTIFACT == 'true' && env.BUILD_CONFIGURATION == 'Release'
        run: |
          if ! command -v xvfb-run >/dev/null; then
            if [ '${{ inputs.self_hosted }}' = true ]; then
              echo '::error::Install xvfb-run on the self-hosted runner before running release builds.'
              exit 1
            fi
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          mkdir -p "$RUNNER_TEMP/noveo-release-smoke"
          status=0
          xvfb-run -a timeout --kill-after=3s 15s \
            "$RUNNER_TEMP/noveo-linux-artifact/Telegram" -many \
            -workdir "$RUNNER_TEMP/noveo-release-smoke" \
            > "$RUNNER_TEMP/noveo-release-smoke-output.log" 2>&1 || status=$?
          if [ "$status" -ne 124 ]; then
            cat "$RUNNER_TEMP/noveo-release-smoke-output.log"
            echo "::error::Linux release exited during startup (status $status)."
            exit 1
          fi
          echo 'Linux release remained running during the startup smoke test.'

      - name: Package optimized release.
        if: env.UPLOAD_ARTIFACT == 'true' && env.BUILD_CONFIGURATION == 'Release'
        run: |
          python3 .github/scripts/package_release.py --platform linux \
            --input "$RUNNER_TEMP/noveo-linux-artifact" \
            --output "$RUNNER_TEMP/noveo-linux-packages" --name "$ARTIFACT_NAME"
          echo "ARTIFACT_PATH=$RUNNER_TEMP/noveo-linux-packages" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload artifact.
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}
          compression-level: ${{ env.BUILD_CONFIGURATION == 'Release' && '0' || '1' }}
          retention-days: 14
          if-no-files-found: error

      - name: Record build inputs, including partial builds.
        id: inputs
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        run: python3 .github/scripts/build_cache.py save

      - name: Publish incremental build, including objects after a failure.
        if: >-
          !cancelled() && steps.inputs.outcome == 'success'
          && github.ref_name == github.event.repository.default_branch
          && (steps.inputs.outputs.changed == 'true' || steps.registry-build.outputs.available != 'true')
        run: >-
          python3 .github/scripts/registry_cache.py push
          --reference "$REGISTRY_CACHE:$BUILD_CACHE_VARIANT-$BUILD_ENV_KEY"
          --key "$BUILD_ENV_KEY" --root "$PWD" --paths out --compression zstd

      - name: Compiler cache statistics.
        id: ccache-stats
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        run: |
          docker run --rm -u "$(id -u)" -v "$CCACHE_DIR:/var/cache/ccache" "$IMAGE_TAG" ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"
          MISSES=$(docker run --rm -u "$(id -u)" -v "$CCACHE_DIR:/var/cache/ccache" "$IMAGE_TAG" ccache --print-stats | sed -n 's/^cache_miss\t//p' | head -1)
          case "$MISSES" in (*[!0-9]*|'') MISSES=0;; esac
          echo "misses=$MISSES" >> "$GITHUB_OUTPUT"

      - name: Save Telegram Desktop cache.
        if: >-
          !cancelled() && steps.ccache-stats.outcome == 'success'
          && github.ref_name == github.event.repository.default_branch
          && !inputs.self_hosted
          && fromJSON(steps.ccache-stats.outputs.misses) > 0
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-tdesktop.outputs.cache-primary-key }}
