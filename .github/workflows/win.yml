name: NoveoDesktop Windows Debug

on:
  workflow_dispatch:
    inputs:
      environment_only:
        description: Prepare and publish dependencies without building the app
        type: boolean
        default: false
      build_missing_environment:
        description: Allow a cold dependency build if snapshots are missing
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: noveo-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 360

    strategy:
      matrix:
        arch: [x64]
        qt: [qt6]
        generator: ["Ninja Multi-Config"]

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: ${{ inputs.environment_only && 'true' || 'false' }}
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IDLE_TIMEOUT: "0"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries${{ matrix.arch == 'x64' && '\win64' || '' }}>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: ${{ matrix.arch }}
          sdk: ${{ env.SDK }}
          toolset: "14.44"

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Install registry client.
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6
        with:
          version: 1.3.4

      - name: Registry login.
        shell: pwsh
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:REGISTRY_TOKEN | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          if ($LASTEXITCODE) { throw 'Registry login failed' }

      - name: Build toolchain identity.
        shell: bash
        run: |
          TOOLCHAIN_KEY=$(printf '%s\n' "$VCToolsVersion" "$(cmake --version)" | sha256sum | cut -d ' ' -f1)
          DEPENDENCY_KEY=$(printf '%s\n' "v1" "$CACHE_KEY" "$VCToolsVersion" "${{ matrix.arch }}" "${{ matrix.qt }}" | sha256sum | cut -d ' ' -f1)
          BUILD_SNAPSHOT_KEY=$(printf '%s\n' "$DEPENDENCY_KEY" "$TOOLCHAIN_KEY" | sha256sum | cut -d ' ' -f1)
          echo "BUILD_SNAPSHOT_KEY=$BUILD_SNAPSHOT_KEY" >> "$GITHUB_ENV"
          echo "DEPENDENCY_KEY=$DEPENDENCY_KEY" >> "$GITHUB_ENV"
          echo "REGISTRY_CACHE=ghcr.io/${GITHUB_REPOSITORY,,}-windows-cache" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_KEY=$TOOLCHAIN_KEY" >> "$GITHUB_ENV"

      - name: Restore registry dependencies.
        id: registry-deps
        run: |
          cd %TBUILD%\%REPO_NAME%
          python .github\scripts\registry_cache.py pull --reference %REGISTRY_CACHE%:deps-%DEPENDENCY_KEY% --key %DEPENDENCY_KEY% --root "%TBUILD%" --paths ThirdParty Libraries/win64

      - name: ThirdParty cache.
        if: steps.registry-deps.outputs.available != 'true'
        id: cache-third-party
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        if: steps.registry-deps.outputs.available != 'true'
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-libs-v2-

      - name: Qt cache.
        if: steps.registry-deps.outputs.available != 'true'
        id: cache-qt
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-

      - name: Require explicit cold build.
        if: steps.registry-deps.outputs.available != 'true' && !(steps.cache-third-party.outputs.cache-hit == 'true' && steps.cache-libs.outputs.cache-hit == 'true' && steps.cache-qt.outputs.cache-hit == 'true') && !inputs.build_missing_environment
        shell: pwsh
        run: throw 'Windows dependencies are missing. Run once with build_missing_environment enabled to publish a durable snapshot.'

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent ${{ matrix.qt }}

      - name: Read configuration matrix.
        shell: bash
        run: |
          ARTIFACT_NAME="NoveoDesktop-Windows-Debug"

          ARCH=""
          if [ -n "${{ matrix.arch }}" ]; then
            case "${{ matrix.arch }}" in
              x64_x86) ARCH="x86";;
              arm64) ARCH="arm";;
              *) ARCH="${{ matrix.arch }}";;
            esac
            echo "Architecture from matrix: $ARCH"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.arch }}"
          fi

          if [ -n "${{ matrix.qt }}" ]; then
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.qt }}"
          fi

          GENERATOR=""
          if [ -n "${{ matrix.generator }}" ]; then
            GENERATOR="-G \"${{ matrix.generator }}\""
            echo "Generator from matrix: $GENERATOR"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.generator }}"
          fi
          echo "TDESKTOP_BUILD_GENERATOR=$GENERATOR" >> $GITHUB_ENV

          [ -n "$GENERATOR" ] && ARCH=""
          echo "TDESKTOP_BUILD_ARCH=$ARCH" >> $GITHUB_ENV

          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

          API="-D TDESKTOP_API_TEST=ON"
          if [ $GITHUB_REF == 'refs/heads/nightly' ]; then
            echo "Use the open credentials."
            API="-D TDESKTOP_API_ID=611335 -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c"
          fi
          echo "TDESKTOP_BUILD_API=$API" >> $GITHUB_ENV

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Publish dependencies before compiling the app.
        if: steps.registry-deps.outputs.available != 'true' && github.ref == 'refs/heads/main'
        run: |
          cd %TBUILD%\%REPO_NAME%
          python .github\scripts\registry_cache.py push --reference %REGISTRY_CACHE%:deps-%DEPENDENCY_KEY% --key %DEPENDENCY_KEY% --root "%TBUILD%" --paths ThirdParty Libraries/win64

      - name: Compiler cache.
        uses: Mozilla-Actions/sccache-action@v0.0.11

      - name: Restore registry incremental build.
        id: registry-build
        if: env.ONLY_CACHE == 'false'
        run: |
          cd %TBUILD%\%REPO_NAME%
          python .github\scripts\registry_cache.py pull --reference %REGISTRY_CACHE%:out-%BUILD_SNAPSHOT_KEY% --key %BUILD_SNAPSHOT_KEY% --root "%TBUILD%\%REPO_NAME%" --paths out

      - name: Restore incremental build.
        id: cache-build
        if: env.ONLY_CACHE == 'false' && steps.registry-build.outputs.available != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out
          key: Windows-x64-out-v1-${{ env.CACHE_KEY }}-${{ env.TOOLCHAIN_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: Windows-x64-out-v1-${{ env.CACHE_KEY }}-${{ env.TOOLCHAIN_KEY }}-

      - name: Restore unchanged input timestamps.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd %TBUILD%\%REPO_NAME%
          python .github\scripts\build_cache.py restore

      - name: Telegram Desktop build.
        id: build
        if: env.ONLY_CACHE == 'false'
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          %TDESKTOP_BUILD_GENERATOR% ^
          %TDESKTOP_BUILD_ARCH% ^
          ${{ matrix.qt }} ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=Debug ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D CMAKE_C_COMPILER_LAUNCHER=sccache ^
          -D CMAKE_CXX_COMPILER_LAUNCHER=sccache ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

          cmake --build ..\out --config Debug --parallel

      - name: Record build inputs.
        id: inputs
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        run: |
          cd %TBUILD%\%REPO_NAME%
          python .github\scripts\build_cache.py save
          sccache --show-stats

      - name: Publish incremental build, including objects after a failure.
        if: ${{ !cancelled() && steps.inputs.outcome == 'success' && github.ref == 'refs/heads/main' && (steps.inputs.outputs.changed == 'true' || steps.registry-build.outputs.available != 'true') }}
        run: |
          cd %TBUILD%\%REPO_NAME%
          python .github\scripts\registry_cache.py push --reference %REGISTRY_CACHE%:out-%BUILD_SNAPSHOT_KEY% --key %BUILD_SNAPSHOT_KEY% --root "%TBUILD%\%REPO_NAME%" --paths out

      - name: Stage Windows binaries.
        if: env.ONLY_CACHE == 'false' && ((env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly'))
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildOutput = Join-Path (Join-Path $env:TBUILD $env:REPO_NAME) 'out\Debug'
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifact'
          New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null
          foreach ($binary in @('Telegram.exe', 'Updater.exe')) {
            $source = Join-Path $buildOutput $binary
            if (!(Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Build output is missing: $source"
            }
            Copy-Item -LiteralPath $source -Destination $artifactDirectory -Force
          }
      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: env.ONLY_CACHE == 'false' && ((env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly'))
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ github.workspace }}/artifact/
          compression-level: 1
          retention-days: 14
          if-no-files-found: error
